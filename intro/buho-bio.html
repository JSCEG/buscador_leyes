<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buscador Jurídico · Guía del búho</title>
<style>




/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

/* La guía del búho: sistema Búho (src/styles/design/variables.css). Las letras son las del sitio; el fondo, transparente. */
@font-face { font-family: Manrope; src: url('/fonts/Manrope-Variable.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
@font-face { font-family: Fraunces; src: url('/fonts/Fraunces-Variable.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: Fraunces; src: url('/fonts/Fraunces-Variable-Italic.woff2') format('woff2'); font-weight: 100 900; font-style: italic; font-display: swap; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
:root { color-scheme: normal; }
[hidden] { display: none !important; }
.bb-dia { --papel-alto: #ffffff; --linea: #d9dbdb; --tinta: #0a0707; --tinta-suave: #5b5e63; --rojo: #9b2247; --accion: #0a0707; --on-accion: #f4f4f2; --cristal: #ffffff8c; --cristal-fuerte: #fbfaf7db; --cristal-borde: #0a07071a; --cristal-borde-hover: #0a070766; }
.bb-noche { --papel-alto: #13151f; --linea: #262a36; --tinta: #f1efea; --tinta-suave: #a4a7ae; --rojo: #e57a9a; --accion: #e9e9e9; --on-accion: #0a0707; --cristal: #13151f8c; --cristal-fuerte: #0b0d1df0; --cristal-borde: #ffffff1a; --cristal-borde-hover: #ffffff66; }
#app.bb-raiz { position: fixed; inset: 0; color: var(--tinta); font-family: Manrope, Calibri, sans-serif; font-weight: 450; transition: color 320ms; }
.bb-lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bb-cristal { background: var(--cristal); border: 1px solid var(--cristal-borde); -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px); }
.bb-fuerte { background: var(--cristal-fuerte); border: 1px solid var(--cristal-borde); -webkit-backdrop-filter: saturate(160%) blur(22px); backdrop-filter: saturate(160%) blur(22px); box-shadow: 0 18px 48px -18px #0a070740; }
.bb-trazo { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.bb-senal { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.bb-senal line { stroke: var(--rojo); stroke-width: 1.25; opacity: 0; }
.bb-senal circle { fill: var(--rojo); opacity: 0; }

.bb-titulo { position: absolute; top: 24px; left: 24px; width: 196px; padding: 14px 16px; border-radius: 16px; box-sizing: border-box; }
.bb-kicker { margin: 0 0 2px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--rojo); font-weight: 600; }
.bb-titulo h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 25px; line-height: 1.12; letter-spacing: -.01em; }
.bb-titulo h1 span { font-style: italic; }
.bb-pista { margin: 6px 0 0; font-size: 13px; line-height: 1.4; color: var(--tinta-suave); }

.bb-secs { position: absolute; top: 148px; left: 24px; width: 196px; padding: 6px; box-sizing: border-box; border-radius: 16px; display: flex; flex-direction: column; gap: 2px; }
.bb-sec { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; font-size: 14px; text-align: left; min-height: 40px; padding: 0 12px; border-radius: 11px; cursor: pointer; white-space: nowrap; transition: background-color 160ms, color 160ms; }
.bb-sec:hover { background: var(--cristal-borde); }
.bb-sec[aria-pressed="true"] { background: var(--accion); color: var(--on-accion); }

.bb-barra { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; padding: 4px; border-radius: 26px; width: max-content; max-width: calc(100% - 24px); box-sizing: border-box; }
.bb-chip { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: 22px; cursor: pointer; white-space: nowrap; transition: background-color 160ms, color 160ms; }
.bb-chip:hover { background: var(--cristal-borde); }
.bb-chip[aria-pressed="true"] { background: var(--accion); color: var(--on-accion); }
.bb-salir { appearance: none; position: absolute; top: 24px; right: 24px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: var(--accion); color: var(--on-accion); font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
.bb-salir:hover { opacity: .88; }
.bb-colores { display: flex; align-items: center; padding: 0 4px; }
.bb-color { appearance: none; width: 32px; height: 40px; padding: 0; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.bb-color span { display: block; width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1px #ffffff40, 0 0 0 1px var(--cristal-borde); transition: box-shadow 160ms; }
.bb-color[aria-pressed="true"] span { box-shadow: inset 0 0 0 1px #ffffff40, 0 0 0 2px var(--papel-alto), 0 0 0 4px var(--tinta); }

.bb-ficha { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); width: 340px; padding: 16px 20px 20px; border-radius: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
.bb-ficha-cab, .bb-ficha-nombre, .bb-ficha-pie { display: flex; align-items: center; gap: 8px; }
.bb-ficha-cab { justify-content: space-between; }
.bb-ficha-nombre { gap: 12px; }
.bb-ficha-pie { margin-top: 4px; }
.bb-paso { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); }
.bb-avance { display: block; height: 2px; border-radius: 2px; background: var(--linea); overflow: hidden; }
.bb-avance i { display: block; height: 100%; width: 0; background: var(--rojo); }
.bb-ico { width: 40px; height: 40px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; background: var(--cristal-borde); color: var(--rojo); flex: none; }
.bb-ficha h2 { margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 24px; line-height: 1.15; }
.bb-texto { margin: 0; font-size: 15px; line-height: 1.5; color: var(--tinta-suave); }
.bb-flecha { appearance: none; width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--cristal-borde-hover); background: transparent; color: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none; transition: background-color 160ms; }
.bb-flecha:hover { background: var(--cristal-borde); }
.bb-x { appearance: none; width: 32px; height: 32px; border: 0; border-radius: 9px; background: transparent; color: var(--tinta-suave); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.bb-x:hover { background: var(--cristal-borde); color: var(--tinta); }
.bb-ir { appearance: none; border: 0; cursor: pointer; flex: 1; min-height: 40px; border-radius: 11px; background: var(--accion); color: var(--on-accion); font: inherit; font-size: 14px; padding: 0 14px; white-space: nowrap; }
.bb-ir:hover { opacity: .88; }
.bb-saltar { appearance: none; border: 0; background: transparent; color: var(--tinta-suave); font: inherit; font-size: 13px; padding: 6px 0 0; cursor: pointer; align-self: flex-start; text-decoration: underline; text-underline-offset: 3px; }
button:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }

@media (max-width: 820px) {
    .bb-titulo { top: 10px; left: 10px; width: auto; padding: 8px 14px; border-radius: 13px; }
    .bb-titulo h1 { font-size: 19px; }
    .bb-salir { top: 10px; right: 10px; padding: 0 14px; }
    .bb-pista { display: none; }
    .bb-secs { top: auto; left: 0; right: 0; bottom: 70px; width: auto; padding: 0 10px; flex-direction: row; overflow-x: auto; background: transparent; border: 0; -webkit-backdrop-filter: none; backdrop-filter: none; scrollbar-width: none; gap: 6px; }
    .bb-sec { background: var(--cristal-fuerte); border: 1px solid var(--cristal-borde); min-height: 44px; flex: none; }
    .bb-barra { left: 18px; right: 18px; bottom: 14px; transform: none; width: auto; max-width: none; border-radius: 26px; flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
    .bb-barra::-webkit-scrollbar, .bb-secs::-webkit-scrollbar { display: none; }
    .bb-chip, .bb-colores { flex: none; }
    .bb-chip { min-height: 44px; padding: 0 10px; font-size: 13.5px; }
    .bb-color { width: 40px; height: 44px; }
    .bb-ficha { right: 18px; left: 18px; bottom: 14px; top: auto; transform: none; width: auto; padding: 12px 16px 16px; }
    .bb-con-ficha .bb-barra, .bb-con-ficha .bb-secs { display: none; }
    .bb-ir, .bb-flecha { min-height: 44px; height: 44px; }
    .bb-flecha { width: 44px; }
}
@media (max-height: 520px) { .bb-secs { display: none; } }
@media (prefers-reduced-motion: reduce) { .bb-raiz, .bb-sec, .bb-chip { transition: none; } }

</style>
</head>
