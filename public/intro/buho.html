<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buscador Jurídico · Entrada</title>
<style>




/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

/* Entrada viva del búho. Fondo transparente: el sitio pone detrás el mapa de México. Letras del sitio (Fraunces y
   Manrope), tinta y guinda del sistema Búho; en oscuro, marfil sobre la noche del sitio. */
@font-face { font-family: 'Manrope'; font-weight: 200 800; font-display: swap; src: url('/fonts/Manrope-Variable.woff2') format('woff2'); }
@font-face { font-family: 'Fraunces'; font-weight: 100 900; font-display: swap; src: url('/fonts/Fraunces-Variable.woff2') format('woff2'); }

:root { --tinta: #171317; --suave: #5b5e63; --guinda: #9b2247; --papel: #faf8f5; --chip: rgba(255, 255, 255, .78); --linea: rgba(23, 19, 23, .14); }
:root[data-tema="oscuro"] { --tinta: #f1efea; --suave: #b9b4ad; --guinda: #e57a9a; --papel: #141114; --chip: rgba(30, 26, 30, .72); --linea: rgba(241, 239, 234, .18); }

html, body { margin: 0; height: 100%; overflow: hidden; background: transparent !important; }
#app { position: fixed; inset: 0; font-family: 'Manrope', system-ui, sans-serif; color: var(--tinta); -webkit-tap-highlight-color: transparent; }
.b-lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.b-lienzo.arrastra { cursor: grabbing; }
.b-guias { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.b-guias line { stroke: var(--guinda); stroke-width: 1.3; stroke-dasharray: 3 5; opacity: 0; }

/* las secciones: botones bajo cada módulo 3D */
.b-menu { position: absolute; inset: 0; pointer-events: none; }
.b-sec {
    position: absolute; left: 0; top: 0; pointer-events: auto; visibility: hidden; opacity: 0;
    font: 650 clamp(12px, 1.25vw + 4px, 17px)/1 'Manrope', system-ui, sans-serif; letter-spacing: .01em; white-space: nowrap;
    color: var(--tinta); background: var(--chip); border: 1px solid var(--linea); border-radius: 999px;
    padding: .5em .85em; min-height: 32px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: color .18s, background-color .18s, border-color .18s;
}
.b-sec.is-activo, .b-sec:focus-visible { color: #fff; background: var(--guinda); border-color: var(--guinda); outline: none; }
:root[data-tema="oscuro"] .b-sec.is-activo, :root[data-tema="oscuro"] .b-sec:focus-visible { color: #141114; }

.b-titulo {
    position: absolute; left: 50%; top: max(18px, env(safe-area-inset-top)); transform: translate(-50%, -6px); text-align: center;
    opacity: 0; transition: opacity .6s cubic-bezier(.16, 1, .3, 1), transform .6s cubic-bezier(.16, 1, .3, 1); pointer-events: none;
}
.b-nombre { margin: 0; font: 560 clamp(22px, 2.6vw + 8px, 40px)/1.05 'Fraunces', Georgia, serif; letter-spacing: -.01em; }
.b-raya { display: block; width: 2.4em; height: 2px; margin: .5em auto .45em; background: var(--guinda); font-size: 14px; }
.b-sub { margin: 0; font-weight: 500; font-size: clamp(12px, .8vw + 6px, 15px); color: var(--suave); letter-spacing: .02em; }

.b-barra {
    position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translate(-50%, 8px);
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100% - 32px);
    opacity: 0; transition: opacity .5s cubic-bezier(.16, 1, .3, 1) .15s, transform .5s cubic-bezier(.16, 1, .3, 1) .15s;
}
.b-chip {
    font: 600 14px/1 'Manrope', system-ui, sans-serif; color: var(--tinta); background: var(--chip); border: 1px solid var(--linea);
    border-radius: 999px; padding: 0 16px; min-height: 40px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background-color .18s, color .18s, border-color .18s, transform .12s;
}
.b-chip:hover { border-color: var(--guinda); }
.b-chip:active { transform: scale(.97); }
.b-chip[aria-pressed="true"]:not([data-alas]) { border-color: var(--guinda); color: var(--guinda); }
.b-chip:focus-visible { outline: 2px solid var(--guinda); outline-offset: 2px; }
.b-entrar { background: var(--guinda); border-color: var(--guinda); color: #fff; }
:root[data-tema="oscuro"] .b-entrar { color: #141114; }
.b-entrar:hover { filter: brightness(1.08); }

.b-pista {
    position: absolute; left: 50%; top: calc(max(18px, env(safe-area-inset-top)) + 96px); transform: translateX(-50%); margin: 0; font-size: 12px; color: var(--suave); white-space: nowrap;
    letter-spacing: .04em; opacity: 0; transition: opacity .5s; pointer-events: none;
}
#app.is-menu .b-titulo { opacity: 1; transform: translate(-50%, 0); }
#app.is-menu .b-barra { opacity: 1; transform: translate(-50%, 0); }
#app.is-menu .b-pista:not(.is-oculta) { opacity: .7; }

/* ficha de cada parte: como el recorrido del sitio */
.b-senal { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity .25s; overflow: visible; }
.b-senal line { stroke: var(--guinda); stroke-width: 1.5; }
.b-senal circle { fill: var(--guinda); }
.b-ficha {
    position: absolute; right: max(24px, 3vw); top: 50%; transform: translateY(-50%); width: min(340px, calc(100% - 32px)); box-sizing: border-box;
    padding: 18px 20px 16px; border-radius: 16px; background: var(--chip); border: 1px solid var(--linea);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 18px 50px rgba(23, 19, 23, .16);
    animation: b-ficha-in .32s cubic-bezier(.16, 1, .3, 1);
}
.b-ficha[hidden] { display: none; }
@keyframes b-ficha-in { from { opacity: 0; transform: translateY(calc(-50% + 10px)); } }
.b-ficha-x { position: absolute; right: 8px; top: 8px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--suave); font-size: 22px; line-height: 1; cursor: pointer; }
.b-ficha-x:hover { color: var(--tinta); }
.b-ficha-paso { margin: 0 32px 10px 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--guinda); }
.b-ficha-cab { display: flex; align-items: center; gap: 12px; }
.b-ficha-ico { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--guinda); color: #fff; }
:root[data-tema="oscuro"] .b-ficha-ico { color: #141114; }
.b-ficha-ico svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.b-ficha h2 { margin: 0; font: 560 26px/1.1 'Fraunces', Georgia, serif; letter-spacing: -.01em; }
.b-ficha-texto { margin: 12px 0 16px; font-size: 15px; line-height: 1.5; color: var(--tinta); }
.b-ficha-pie { display: flex; gap: 8px; align-items: center; }
.b-ficha-flecha { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linea); background: transparent; color: var(--tinta); font-size: 20px; cursor: pointer; }
.b-ficha-flecha:hover { border-color: var(--guinda); }
.b-ficha-ir { margin-left: auto; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--guinda); color: #fff; font: 650 14px/1 'Manrope', system-ui, sans-serif; cursor: pointer; }
:root[data-tema="oscuro"] .b-ficha-ir { color: #141114; }
.b-ficha button:focus-visible { outline: 2px solid var(--guinda); outline-offset: 2px; }
#app.is-ficha .b-pista { opacity: 0; }
#app.is-cerca .b-titulo { opacity: 0; }
/* recorrido automático: barrita de avance arriba de la ficha y «Saltar recorrido» */
.b-ficha-avance { display: none; position: absolute; left: 20px; right: 20px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--linea); overflow: hidden; }
.b-ficha-avance i { display: block; height: 100%; width: 100%; background: var(--guinda); transform-origin: left; transform: scaleX(0); animation: b-avance 4.6s linear forwards; }
@keyframes b-avance { to { transform: scaleX(1); } }
#app.is-auto .b-ficha-avance { display: block; }
.b-ficha-saltar { display: none; margin: 10px auto 0; border: 0; background: none; color: var(--suave); font: 600 12px/1 'Manrope', system-ui, sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px; }
#app.is-auto .b-ficha-saltar { display: block; }
.b-ficha.is-final .b-ficha-ico { background: var(--tinta); }

@media (max-width: 599px) {
    .b-ficha { right: 16px; left: 16px; top: auto; bottom: calc(118px + env(safe-area-inset-bottom)); transform: none; width: auto; padding: 14px 16px 12px; animation-name: b-ficha-in-m; }
    @keyframes b-ficha-in-m { from { opacity: 0; transform: translateY(10px); } }
    .b-ficha h2 { font-size: 22px; }
    .b-ficha-texto { font-size: 14px; margin: 8px 0 12px; }

    .b-chip { font-size: 13px; padding: 0 12px; min-height: 38px; }
    .b-pista { display: none; }
    .b-sec { padding: .42em .6em; font-size: 12px; min-height: 28px; }
}
@media (prefers-reduced-motion: reduce) {
    .b-titulo, .b-barra { transition: none; }
}

</style>
</head>
