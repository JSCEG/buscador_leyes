<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central eólica · ¿Cómo funciona?</title>
<style>




/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

/* Estilo común de las máquinas de «¿Cómo funciona?» (sistema Búho + referencia del mosquito mecánico). Lo usan todas;
   scripts/build-conceptos-3d.mjs lo pone antes del style.css propio de cada máquina, que puede ajustarlo. */
@font-face { font-family: "Fraunces"; src: url("/fonts/Fraunces-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Manrope"; src: url("/fonts/Manrope-Variable.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }

:root { --papel: #fafafa; --papel-alto: #ffffff; --ceniza: #ebebe9; --linea: #d9dbdb; --tinta: #0a0707; --tinta-suave: #5b5e63; --rojo: #9b2247; --rojo-suave: #9b224714; --accion: #0a0707; --on-accion: #f4f4f2; --azul: #2e6fb0; }
:root[data-tema="oscuro"] { --papel: #080a19; --papel-alto: #13151f; --ceniza: #1c1f2a; --linea: #262a36; --tinta: #f1efea; --tinta-suave: #a4a7ae; --rojo: #e57a9a; --rojo-suave: #e57a9a24; --accion: #e9e9e9; --on-accion: #0a0707; --azul: #6ea8e0; }

/* El kit de la skill fija una consola de pantalla completa; aquí la figura fluye dentro de la página. */
html, body { height: auto; overflow: visible; background: var(--papel); }
body { margin: 0; color: var(--tinta); font: 450 14px/1.45 Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#app { position: static; inset: auto; color: var(--tinta); font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 2px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }

.g-escena { position: relative; aspect-ratio: 16 / 10; border: 1px solid var(--linea); border-radius: 16px; overflow: hidden; background: var(--papel); touch-action: none; }
.g-lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.g-escena.arrastra .g-lienzo { cursor: grabbing; }
.g-guia { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.g-guia line { stroke: var(--rojo); stroke-width: 1.5; }
.g-guia circle { fill: var(--rojo); stroke: var(--papel-alto); stroke-width: 2; }
.g-etiqueta { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; max-width: 260px; padding: 6px 12px 6px 6px; border: 1px solid var(--rojo); border-radius: 999px; background: var(--papel-alto); box-shadow: 0 8px 20px -12px #0a070766; pointer-events: none; will-change: transform; }
.g-etiqueta[hidden] { display: none; }
.g-etiqueta b { display: grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--rojo); color: var(--papel-alto); font: 700 12px/1 Manrope, sans-serif; }
.g-etiqueta span { font: 500 15px/1.2 Fraunces, Georgia, serif; color: var(--tinta); }
.g-escena-acciones { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; pointer-events: none; }
.g-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 12px; border: 1px solid var(--linea); border-radius: 999px; background: color-mix(in srgb, var(--papel-alto) 88%, transparent); font-size: 12.5px; font-weight: 600; cursor: pointer; pointer-events: auto; backdrop-filter: blur(8px); }
.g-chip[aria-pressed="true"] { border-color: var(--rojo); color: var(--rojo); background: color-mix(in srgb, var(--papel-alto) 80%, var(--rojo-suave)); }
.g-chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.g-chip[aria-pressed="true"] i { animation: g-late 1.2s steps(2) infinite; }
@keyframes g-late { 50% { opacity: .2; } }

.g-tablero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; }
.g-tablero > section, .g-partes { padding: 12px 14px; border: 1px solid var(--linea); border-radius: 14px; background: var(--papel-alto); }
.g-cifras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.g-cifras div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.g-cifras span { font-size: 12px; font-weight: 600; color: var(--tinta-suave); }
.g-cifras b { font: 500 26px/1.1 Fraunces, Georgia, serif; font-variant-numeric: tabular-nums; color: var(--tinta); }
.g-cifras small { font-size: 11.5px; color: var(--tinta-suave); }
.g-control { display: flex; flex-direction: column; gap: 10px; }
.g-deslizador { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
.g-deslizador input { width: 100%; accent-color: var(--rojo); }
.g-seg { display: inline-flex; align-self: flex-start; gap: 2px; padding: 3px; border: 1px solid var(--linea); border-radius: 12px; background: var(--papel); }
.g-seg button { min-height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: var(--tinta-suave); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.g-seg button[aria-checked="true"] { background: var(--accion); color: var(--on-accion); }
.g-curva { grid-column: 1 / -1; }
.g-curva-cab { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px; }
.g-curva-cab b { font: 500 16px/1.2 Fraunces, Georgia, serif; }
.g-curva-cab span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--tinta-suave); }
.g-curva-cab i { display: inline-block; width: 14px; height: 3px; margin-left: 6px; border-radius: 2px; }
.g-curva-cab .f1 { background: var(--rojo); }
.g-curva-cab .f2 { background: var(--azul); }
.g-curva-cab .f3 { background: var(--tinta-suave); }
.g-curva canvas { display: block; width: 100%; height: 110px; margin: 6px 0; }
.g-curva p { margin: 0; font-size: 12.5px; color: var(--tinta-suave); }
.g-partes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.g-partes button { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 5px; border: 1px solid var(--linea); border-radius: 999px; background: var(--papel); font-size: 13px; font-weight: 600; cursor: pointer; }
.g-partes button span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ceniza); font-size: 12px; font-weight: 700; }
.g-partes button[aria-pressed="true"] { border-color: var(--rojo); color: var(--rojo); background: var(--rojo-suave); }
.g-partes button[aria-pressed="true"] span { background: var(--rojo); color: var(--papel-alto); }

@media (max-width: 620px) {
  .g-escena { aspect-ratio: 4 / 3; }
  .g-tablero { grid-template-columns: minmax(0, 1fr); }
  .g-cifras b { font-size: 22px; }
}
@media (max-width: 480px) { .g-escena { aspect-ratio: 4 / 5; } }
@media (prefers-reduced-motion: reduce) { .g-chip[aria-pressed="true"] i { animation: none; } }

/* Logo del Buscador en la esquina de la escena */
.g-marca { position: absolute; right: 12px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; background: color-mix(in srgb, var(--papel-alto) 78%, transparent); color: var(--tinta); pointer-events: none; backdrop-filter: blur(6px); }
.g-marca svg { width: 18px; height: 21px; flex: none; }
.g-marca span { font: 500 13px/1 Fraunces, Georgia, serif; letter-spacing: -0.01em; }

/* Botón de pantalla completa */
.g-grupo { display: inline-flex; gap: 6px; }
.g-chip-icono { width: 34px; padding: 0; justify-content: center; }
.g-chip-icono svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Pantalla completa: la escena llena la pantalla y abajo flotan las partes y el control de velocidad */
.g-flot { display: none; }
.g-escena.completa { aspect-ratio: auto; width: 100%; height: 100%; border: 0; border-radius: 0; }
.g-escena.simulada { position: fixed; inset: 0; z-index: 10; width: 100vw; height: 100vh; height: 100dvh; }
html.g-bloqueo, html.g-bloqueo body { overflow: hidden; }
.g-escena.completa .g-escena-acciones { top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); }
.g-escena.completa .g-marca { top: calc(max(12px, env(safe-area-inset-top)) + 44px); right: max(12px, env(safe-area-inset-right)); bottom: auto; }
.g-escena.completa .g-flot { position: absolute; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.g-flot > * { pointer-events: auto; max-width: 100%; border: 1px solid var(--linea); background: color-mix(in srgb, var(--papel-alto) 90%, transparent); backdrop-filter: blur(10px); box-shadow: 0 10px 28px -18px #0a070780; }
.g-flot-partes { display: flex; gap: 6px; padding: 6px; border-radius: 999px; overflow-x: auto; scrollbar-width: none; }
.g-flot-partes::-webkit-scrollbar { display: none; }
.g-flot-partes button { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 5px; border: 1px solid transparent; border-radius: 999px; background: none; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.g-flot-partes button span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ceniza); font-size: 12px; font-weight: 700; }
.g-flot-partes button[aria-pressed="true"] { border-color: var(--rojo); color: var(--rojo); background: var(--rojo-suave); }
.g-flot-partes button[aria-pressed="true"] span { background: var(--rojo); color: var(--papel-alto); }
.g-flot-ctrl { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; padding: 8px 14px; border-radius: 16px; }
@media (max-width: 620px) {
  .g-escena.completa .g-marca span { display: none; }
}

/* Cifra principal en la escena */
.g-hud { position: absolute; left: 14px; bottom: 12px; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 14px; background: color-mix(in srgb, var(--papel-alto) 80%, transparent); backdrop-filter: blur(6px); pointer-events: none; }
.g-hud > b { font: 500 34px/1 Fraunces, Georgia, serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--tinta); }
.g-hud > span { font-size: 12.5px; font-weight: 600; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.g-escena.completa .g-hud { top: calc(max(12px, env(safe-area-inset-top)) + 46px); left: max(12px, env(safe-area-inset-left)); bottom: auto; }

/* Números de las piezas cuando la máquina está desarmada */
.g-nums { position: absolute; inset: 0; pointer-events: none; transition: opacity .2s; }
.g-nums[hidden] { display: none; }
.g-nums span { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 3px; border: 1px solid var(--linea); border-radius: 999px; background: var(--papel-alto); white-space: nowrap; will-change: transform; }
.g-nums b { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--ceniza); font: 700 11px/1 Manrope, sans-serif; }
.g-nums i { font: 500 13px/1 Fraunces, Georgia, serif; font-style: normal; }
.g-nums span.activo { border-color: var(--rojo); color: var(--rojo); }
.g-nums span.activo b { background: var(--rojo); color: var(--papel-alto); }

/* Controles: dos deslizadores y dos selectores, iguales en el tablero y en pantalla completa */
.g-control { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; align-content: start; }
.g-filas { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.g-flot-ctrl { display: grid; grid-template-columns: repeat(2, minmax(160px, 240px)); gap: 8px 16px; padding: 10px 14px; border-radius: 16px; }
.g-flot-ctrl .g-filas { justify-content: center; }
@media (max-width: 620px) {
  .g-hud > b { font-size: 26px; }
  .g-nums i { display: none; }
  .g-control { grid-template-columns: minmax(0, 1fr); }
  .g-flot-ctrl { grid-template-columns: minmax(0, 1fr); width: 100%; }
}
@media (max-width: 620px) {
  .g-flot-ctrl .g-filas { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
  .g-flot-ctrl .g-seg { flex: none; }
}

/* Fondo de estudio como la referencia: papel con trazos finos de construcción detrás de la máquina */

:root[data-tema="oscuro"] .g-escena { background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201600%201000%22%20preserveAspectRatio%3D%22xMidYMid%20slice%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23f1efea%22%20stroke-opacity%3D%220.06%22%20stroke-width%3D%221%22%3E%3Ccircle%20cx%3D%22800%22%20cy%3D%22520%22%20r%3D%22430%22%2F%3E%3Ccircle%20cx%3D%22800%22%20cy%3D%22520%22%20r%3D%22610%22%20stroke-dasharray%3D%223%209%22%2F%3E%3Cpath%20d%3D%22M40%20780%20Q%20800%20380%201560%20300%22%2F%3E%3Cpath%20d%3D%22M120%20160%20Q%20760%20520%201500%20880%22%20stroke-dasharray%3D%222%207%22%2F%3E%3Cpath%20d%3D%22M0%20520%20H1600%22%20stroke-opacity%3D%220.036%22%2F%3E%3Cpath%20d%3D%22M800%200%20V1000%22%20stroke-opacity%3D%220.036%22%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%22%23f1efea%22%20fill-opacity%3D%220.132%22%3E%3Ccircle%20cx%3D%22230%22%20cy%3D%22260%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%221380%22%20cy%3D%22210%22%20r%3D%222.5%22%2F%3E%3Ccircle%20cx%3D%221290%22%20cy%3D%22820%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%22330%22%20cy%3D%22840%22%20r%3D%222%22%2F%3E%3Ccircle%20cx%3D%221500%22%20cy%3D%22560%22%20r%3D%222%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") center / cover no-repeat, var(--papel); }

/* Polos de la corriente: + guinda y − grafito, como los cables rojo y negro */
:root { --corriente: #d99700; --positivo: #9b2247; --negativo: #2b2c31; }
:root[data-tema="oscuro"] { --corriente: #ffd23f; --positivo: #e57a9a; --negativo: #c9ccd3; }
.c-polo { position: absolute; left: 0; top: 0; display: grid; place-items: center; width: 22px; height: 22px; border: 1.5px solid var(--negativo); border-radius: 50%; background: var(--papel-alto); color: var(--negativo); font: 700 15px/1 Manrope, sans-serif; pointer-events: none; will-change: transform, opacity; }
.c-polo.es-positivo { border-color: var(--positivo); background: var(--positivo); color: var(--papel-alto); }

/* Estilo común de las plantas con física (fichas, puntos clave, controles, gráficas, tablas y fuentes). Va después de
   conceptos-3d/comun/estilo.css y antes del style.css de la figura. Lo pone scripts/build-conceptos-3d.mjs cuando el
   style.css de la figura empieza con la marca «usa planta-comun». */
:root { --serie-sin: #b0691b; --serie-max: #2f62d9; --serie-actual: #9b2247; }
:root[data-tema="oscuro"] { --serie-sin: #b98d2f; --serie-max: #6690e6; --serie-actual: #d76e8d; }

.g-escena { isolation: isolate; }
.g-escena.arrastra .g-lienzo { cursor: grabbing; }
.h-cielo { position: absolute; inset: 0; background: #0a0e12; opacity: 0; pointer-events: none; }
.g-chip-icono svg, .h-reloj svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* los puntos clave, sobre la central */
.h-pines { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.h-pin { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; height: 26px; min-width: 26px; padding: 0; border: 1.5px solid var(--rojo); border-radius: 13px; background: var(--papel-alto); color: var(--tinta); font: 700 12px/1 Manrope, sans-serif; cursor: pointer; pointer-events: auto; opacity: 0; visibility: hidden; transition: opacity .4s, background-color .15s, color .15s; box-shadow: 0 2px 8px #0a070733; }
.h-pin b { width: 23px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.h-pin span { max-width: 0; overflow: hidden; white-space: nowrap; font-weight: 600; transition: max-width .2s, padding .2s; }
.h-pin:hover span, .h-pin:focus-visible span, .h-pin.is-hover span { max-width: 170px; padding-right: 10px; }
.h-pin:hover, .h-pin.is-elegido, .h-pin.is-hover { background: var(--rojo); color: var(--papel-alto); z-index: 2; }
#app.is-menu .h-pin { opacity: 1; }
.h-senal { opacity: 0; transition: opacity .2s; }

/* girar y acercar */
.h-giros { position: absolute; left: 50%; bottom: 12px; display: flex; gap: 6px; transform: translateX(-50%); transition: left .3s cubic-bezier(.16, 1, .3, 1); }
#app.is-ficha .h-giros { left: calc(50% - 165px); }
/* en anchos medianos la ficha empuja los botones de giro sobre la cifra: la cifra se quita mientras está abierta */
@media (max-width: 905px) { #app.is-ficha .g-hud { display: none; } }
.g-escena.completa .h-giros { bottom: calc(var(--flot, 0px) + 8px); }

/* la ficha de cada punto */
.h-ficha { position: absolute; z-index: 3; right: 12px; top: 54px; width: 318px; max-height: calc(100% - 66px); box-sizing: border-box; overflow-y: auto; padding: 14px 16px 10px; border: 1px solid var(--linea); border-radius: 14px; background: color-mix(in srgb, var(--papel-alto) 95%, transparent); backdrop-filter: blur(12px); box-shadow: 0 14px 34px -22px #0a0707a0; animation: h-entra .32s cubic-bezier(.16, 1, .3, 1); }
.h-ficha[hidden] { display: none; }
@keyframes h-entra { from { opacity: 0; transform: translateY(8px); } }
.g-escena.completa .h-ficha { max-height: calc(100% - 66px - var(--flot, 0px)); }
.h-ficha-x { position: absolute; right: 6px; top: 6px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: none; color: var(--tinta-suave); font-size: 22px; line-height: 1; cursor: pointer; }
.h-ficha-x:hover { color: var(--tinta); }
.h-ficha-paso { margin: 0 32px 8px 0; color: var(--rojo); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.h-ficha-cab { display: flex; align-items: center; gap: 10px; }
.h-ficha-ico { display: grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 11px; background: var(--rojo-suave); color: var(--rojo); }
.h-ficha-ico svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.h-ficha h2 { margin: 0; font: 500 22px/1.12 Fraunces, Georgia, serif; letter-spacing: -.01em; text-wrap: balance; }
.h-ficha-texto { margin: 9px 0 0; font-size: 13.5px; line-height: 1.47; text-wrap: pretty; }
.h-eq { margin: 8px 0 0; padding: 5px 9px; border-radius: 9px; background: var(--ceniza); font-size: 12.5px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; }
.h-eq[hidden] { display: none; }
.h-ficha-pie { display: flex; align-items: center; gap: 7px; margin-top: 10px; }
.h-flecha { flex: none; width: 36px; height: 36px; border: 1px solid var(--linea); border-radius: 50%; background: none; font-size: 20px; line-height: 1; cursor: pointer; }
.h-flecha:hover { border-color: var(--rojo); }
.h-accion { margin-left: auto; min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--accion); color: var(--on-accion); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.h-ficha-avance { display: none; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--linea); }
.h-ficha-avance i { display: block; width: 100%; height: 100%; background: var(--rojo); transform-origin: left; transform: scaleX(0); animation: h-avance 6.5s linear forwards; }
@keyframes h-avance { to { transform: scaleX(1); } }
.h-saltar { display: none; margin: 4px auto 0; padding: 6px; border: 0; background: none; color: var(--tinta-suave); font-size: 12px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
#app.is-auto .h-ficha-avance { display: block; }
#app.is-auto .h-saltar { display: block; }

/* controles */
.h-procesos { grid-column: 1 / -1; display: flex; align-self: stretch; }
.h-procesos button { flex: 1 1 auto; padding: 0 8px; white-space: nowrap; }
.h-corto { display: none; }
.h-mando { align-self: end; min-width: 0; }
.h-mando[hidden] { display: none; }
.h-rotulo { display: flex; justify-content: space-between; gap: 8px; }
.h-rotulo b { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.h-reloj { grid-column: 1 / -1; justify-self: start; }
.h-reloj[hidden] { display: none; }
.h-resumen { grid-column: 1 / -1; margin: 0; font-size: 13px; line-height: 1.42; color: var(--tinta-suave); }
.h-aviso { grid-column: 1 / -1; margin: 0; padding: 5px 9px; border-left: 2px solid var(--corriente); border-radius: 0 7px 7px 0; background: var(--ceniza); font-size: 12px; line-height: 1.35; }
.h-aviso[hidden] { display: none; }

/* lecturas */
.h-lecturas { display: flex; flex-direction: column; gap: 10px; }
.h-lecturas .g-cifras { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.h-lecturas .g-cifras b { font-size: 24px; }
.h-nivel { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--tinta-suave); }
.h-nivel i { display: block; height: 7px; border-radius: 4px; background: var(--ceniza); overflow: hidden; }
.h-nivel u { display: block; height: 100%; border-radius: 4px; background: var(--serie-actual); text-decoration: none; }
.h-nivel-2 u { background: var(--serie-max); }
.h-nivel b { color: var(--tinta); font-weight: 650; font-variant-numeric: tabular-nums; }

/* gráficas */
.g-tablero .h-media { grid-column: auto; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.g-curva .h-diagrama { display: block; flex: 1 1 158px; width: 100%; min-height: 158px; margin: 2px 0 0; }
.h-grafica { position: relative; }
.h-grafica[hidden], .h-barras[hidden], .h-media p[hidden] { display: none; }
.h-grafica svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.h-g-rejilla { stroke: var(--linea); stroke-width: .7; }
.h-g-t { fill: var(--tinta-suave); font: 500 11px Manrope, sans-serif; font-variant-numeric: tabular-nums; }
.h-g-rt { fill: var(--tinta); font: 600 11px Manrope, sans-serif; }
.h-g-ref { stroke: var(--tinta-suave); stroke-width: 1; stroke-dasharray: 3 3; }
.h-g-area { fill: var(--serie-actual); opacity: .1; }
.h-g-linea { fill: none; stroke: var(--serie-actual); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.h-g-serie { fill: none; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.h-g-guia { stroke: var(--tinta-suave); stroke-width: 1; }
.h-g-ahora { stroke: var(--tinta); stroke-width: 1.4; }
.h-g-marca { fill: var(--rojo); stroke: var(--papel-alto); stroke-width: 2; }
.h-g-punta { position: absolute; top: 0; max-width: 92%; padding: 3px 7px; border-radius: 6px; background: var(--tinta); color: var(--papel); font-size: 11px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; text-align: center; transform: translateX(-50%); pointer-events: none; }
.h-g-punta[hidden] { display: none; }
.h-s-sin { --c: var(--serie-sin); }
.h-s-max { --c: var(--serie-max); }
.h-s-actual { --c: var(--serie-actual); }
.g-curva-cab .h-leyenda { flex-wrap: wrap; }
.g-curva-cab .h-leyenda i { width: 12px; height: 3px; margin-left: 8px; border-radius: 2px; background: var(--c); }
.g-curva-cab .h-leyenda i:first-child { margin-left: 0; }
.h-ts-campana { fill: var(--rojo-suave); stroke: var(--tinta-suave); stroke-width: 1.3; stroke-linejoin: round; }
.h-ts-ruta { fill: none; stroke: var(--rojo); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.h-ts-otra { fill: none; stroke: var(--serie-sin); stroke-width: 2; stroke-dasharray: 4 3; stroke-linecap: round; }
.h-ts-p circle { fill: var(--papel-alto); stroke: var(--rojo); stroke-width: 1.5; }
.h-ts-p text { fill: var(--tinta); font: 700 10px Manrope, sans-serif; }
.h-ts-p.es-elegido circle { fill: var(--rojo); }
.h-ts-p.es-elegido text { fill: var(--papel-alto); }
.h-tabla { font-size: 12px; }
.h-tabla summary { padding: 2px 0; color: var(--tinta-suave); font-weight: 600; cursor: pointer; }
.h-tabla table, .h-tabla-suelta table { width: 100%; margin-top: 4px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.h-tabla th, .h-tabla td, .h-tabla-suelta th, .h-tabla-suelta td { padding: 3px 4px; border-bottom: 1px solid var(--linea); text-align: right; }
.h-tabla th, .h-tabla-suelta th { color: var(--tinta-suave); font-weight: 600; }
.h-tabla td:first-child, .h-tabla th:first-child, .h-tabla-suelta td:first-child, .h-tabla-suelta th:first-child { text-align: left; }
.h-tabla-suelta { font-size: 12.5px; overflow-x: auto; }
.h-tabla-suelta td { padding: 5px 4px; vertical-align: middle; }
.h-tabla-suelta td b { display: block; font-weight: 650; }
.h-tabla-suelta td small { color: var(--tinta-suave); font-size: 11.5px; }
.h-tabla-texto td:nth-child(2), .h-tabla-texto td:nth-child(3), .h-tabla-texto th:nth-child(2), .h-tabla-texto th:nth-child(3) { text-align: left; }
.h-col-barra { width: 36%; text-align: left !important; }
.h-celda-barra { display: flex; align-items: center; gap: 6px; }
.h-celda-barra u { display: block; height: 9px; border-radius: 0 4px 4px 0; background: var(--serie-actual); text-decoration: none; min-width: 2px; flex: 0 1 auto; }
.h-celda-barra em { font-style: normal; font-weight: 650; }
.h-barras { display: flex; flex-direction: column; gap: 5px; }
.h-barra-f { display: grid; grid-template-columns: 150px 1fr 34px; align-items: center; gap: 7px; font-size: 12px; opacity: .72; }
.h-barra-f.es-activa { opacity: 1; font-weight: 650; }
.h-barra-f i { display: block; height: 9px; }
.h-barra-f u { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--serie-actual); text-decoration: none; }
.h-barra-f b { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.h-tubos { display: flex; flex-wrap: wrap; gap: 5px 12px; margin: 2px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
.h-tubos li { display: inline-flex; align-items: center; gap: 6px; }
.h-tubos i { width: 16px; height: 6px; border-radius: 3px; }

/* los colores van a todo lo ancho, para no dejar un hueco */
.g-tablero .h-colores { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; }

/* fuentes: a la vista, junto a lo que respaldan */
.g-tablero .h-fuentes { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; }
.h-fuentes ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; margin: 0; padding: 0; list-style: none; }
.h-fuentes li { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 13px; line-height: 1.35; }
.h-fuente-para { color: var(--tinta-suave); font-size: 12px; font-weight: 600; }
.h-fuentes a { color: var(--rojo); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.h-fuentes li b { font-weight: 600; }
.h-fuentes small { color: var(--tinta-suave); font-size: 12px; }

.sin-webgl .g-lienzo, .sin-webgl .h-pines { display: none; }

@media (max-width: 760px) {
  .h-fuentes ul { grid-template-columns: minmax(0, 1fr); }
  .g-tablero .h-media { grid-column: 1 / -1; }
  .h-lecturas { grid-column: 1 / -1; }
  .g-control { grid-column: 1 / -1; }
}
@media (max-width: 619px) {
  .g-escena { aspect-ratio: 3 / 4; }
  .h-largo { display: none; }
  .h-corto { display: inline; }
  .h-solo-grande { display: none; }
  .h-ficha { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 56%; padding: 12px 13px 8px; }
  .g-escena.completa .h-ficha { bottom: calc(var(--flot, 0px) + 8px); max-height: calc(56% - var(--flot, 0px)); }
  .h-ficha h2 { font-size: 20px; }
  .h-ficha-ico { width: 32px; height: 32px; border-radius: 9px; }
  .h-ficha-texto { margin-top: 7px; font-size: 13px; line-height: 1.42; }
  .h-ficha-pie { margin-top: 8px; }
  #app.is-ficha .g-hud, #app.is-ficha .h-giros, #app.is-ficha .g-marca { display: none; }
  .h-giros { left: auto; right: 12px; bottom: 44px; transform: none; }
  .g-marca span { display: none; }
  .h-pin { height: 24px; min-width: 24px; font-size: 11px; }
  .h-pin b { width: 21px; }
  .h-barra-f { grid-template-columns: 118px 1fr 30px; }
  .g-escena.completa .g-flot-ctrl { max-height: 34vh; overflow-y: auto; }
  #app.is-ficha .g-escena.completa .g-flot-ctrl { display: none; }
}
@media (max-width: 480px) { .g-escena { aspect-ratio: 5 / 7; } }
@media (prefers-reduced-motion: reduce) { .h-ficha, .h-ficha-avance i { animation: none; } .h-pin { transition: none; } }

/* botones que aparecen según el modo */
.h-relojes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.h-relojes .h-reloj { grid-column: auto; }
.h-reloj[aria-pressed="true"] { background: var(--rojo); border-color: var(--rojo); color: var(--papel-alto); }
@media (max-width: 619px) { .h-ficha { max-height: 62%; } .g-escena.completa .h-ficha { max-height: calc(62% - var(--flot, 0px)); } }
.h-g-punto { fill: var(--rojo); stroke: var(--papel-alto); stroke-width: 2; }
/* nombres largos de los modos: en anchos medianos no caben y van los cortos */
@media (max-width: 1060px) { .h-largo { display: none; } .h-corto { display: inline; } }
/* pantalla baja y acostada, en pantalla completa: los controles van a un lado; debajo no dejarían lugar a la escena (pagina.js mide lo mismo) */
@media (max-height: 620px) and (orientation: landscape) {
  .g-escena.completa .g-flot { left: auto; top: 54px; bottom: max(8px, env(safe-area-inset-bottom)); right: max(8px, env(safe-area-inset-right)); width: clamp(264px, 42vw, 300px); align-items: stretch; gap: 6px; }
  .g-escena.completa .g-flot-partes { flex: none; }

n 55 a 65 mph"},{autor:"U.S. Energy Information Administration",fecha:"consulta en l\xEDnea",titulo:"Electricity generation from wind",url:"https://www.eia.gov/energyexplained/wind/electricity-generation-from-wind.php",consulta:Gt,para:"C\xF3mo un aerogenerador produce electricidad y c\xF3mo se junta en un parque"},{autor:"U.S. Energy Information Administration",fecha:"15 de octubre de 2020",titulo:"Wind is a growing part of the electricity mix in Texas",url:"https://www.eia.gov/todayinenergy/detail.php?id=45476",consulta:Gt,para:"Para comparar: los aerogeneradores de Texas trabajaron a 44 % en abril de 2019"},{autor:"Wikipedia",fecha:"consulta en l\xEDnea",titulo:"Betz\u2019s law",url:"https://en.wikipedia.org/wiki/Betz%27s_law",consulta:Gt,para:"Lo m\xE1s que un rotor puede sacarle al viento: 16/27, cerca de 59.3 %"},{autor:"Wikipedia",fecha:"consulta en l\xEDnea",titulo:"Tip-speed ratio",url:"https://en.wikipedia.org/wiki/Tip-speed_ratio",consulta:Gt,para:"Qu\xE9 es la velocidad de punta y c\xF3mo se calcula"},{autor:"Wikipedia",fecha:"consulta en l\xEDnea",titulo:"Wind profile power law",url:"https://en.wikipedia.org/wiki/Wind_profile_power_law",consulta:Gt,para:"C\xF3mo crece el viento con la altura: se suele usar el exponente 1/7"},{autor:"Wikipedia",fecha:"consulta en l\xEDnea",titulo:"Wind turbine design",url:"https://en.wikipedia.org/wiki/Wind_turbine_design",consulta:Gt,para:"Arranque de 3 a 4 m/s, paro cerca de 25 m/s, y qu\xE9 pasa cuando sobra viento"},{autor:"Wikipedia",fecha:"consulta en l\xEDnea",titulo:"Wind power",url:"https://en.wikipedia.org/wiki/Wind_power",consulta:Gt,para:"En un parque desarrollado, cerca de 7 di\xE1metros entre m\xE1quinas, y red interna de media tensi\xF3n, a menudo de 34.5 kV"},{autor:"Wikipedia",fecha:"consulta en l\xEDnea",titulo:"Wind farm",url:"https://en.wikipedia.org/wiki/Wind_farm",consulta:Gt,para:"Separarlas quita menos viento a las de atr\xE1s, pero cuesta m\xE1s en caminos, cables y terreno"},{autor:"DTU Wind Energy",fecha:"consulta en l\xEDnea",titulo:"PyWake: Engineering Wind Farm Models",url:"https://topfarm.pages.windenergy.dtu.dk/PyWake/notebooks/EngineeringWindFarmModels.html",consulta:Gt,para:"El modelo de estela de Jensen, que usa esta figura"},{autor:"Comisi\xF3n Federal de Electricidad",fecha:"2026",titulo:"Programa de Desarrollo 2026-2030",url:"https://www.cfe.gob.mx/finanzas/Documents/ProgramaDesarrollo-26.pdf",consulta:Gt,para:"Capacidad: 7,444 MW e\xF3licos, 8 % del sistema"},{autor:"Secretar\xEDa de Energ\xEDa",fecha:"2023",titulo:"Prospectiva del Sector El\xE9ctrico 2023-2037",url:"https://base.energia.gob.mx/Prospectivas23/PSE_23-37_VF.pdf",consulta:Gt,para:"En 2022, 6.03 % de la generaci\xF3n neta sali\xF3 de centrales e\xF3licas"},{autor:"Instituto Mexicano para la Competitividad (IMCO)",fecha:"mayo de 2025",titulo:"Infraestructura para un sistema el\xE9ctrico competitivo (2025-2030)",url:"https://imco.org.mx/wp-content/uploads/2025/05/20250513_Investigacion_Infraestructura_sistema_electrico.pdf",consulta:Gt,para:"E\xF3lica: factor de planta promedio de 32.2 %, p\xE1g. 7"},{autor:"Comisi\xF3n Nacional de Energ\xEDa",fecha:"16 de abril de 2026",titulo:"Disposiciones para la integraci\xF3n de Sistemas de Almacenamiento de Energ\xEDa El\xE9ctrica al Sistema El\xE9ctrico Nacional",url:"https://dof.gob.mx/nota_detalle.php?codigo=5785045&fecha=16/04/2026",consulta:Gt,para:"El CENACE analiza la variabilidad de cada central y puede pedir un Sistema de Almacenamiento de Energ\xEDa El\xE9ctrica (SAEE) o concluir que no hace falta"}];var nv="eolica",kf=zt(9),uu=zt(15),iv=Dr.mw*1e3/(Math.sqrt(3)*400),sv=1-zt(8,{desvio:30}).mw/zt(8).mw,rv=[{parte:"viento",nombre:"Viento",modo:"viento",accion:"tormenta",eq:`Reynosa: ${pe(Lr.reynosa.anual,1)} m/s a 50 m, en promedio`,recorrido:{noche:!1,adentro:!1},icono:'<path d="M3 9h11a3 3 0 1 0-3-3"/><path d="M3 14h16a3 3 0 1 1-3 3"/><path d="M3 19h7"/>',texto:"Todo sale del aire en movimiento. Si el viento sopla al doble, lleva ocho veces m\xE1s energ\xEDa: por eso importa tanto d\xF3nde se pone cada m\xE1quina. Este m\xE1stil mide el viento a varias alturas con sus copas giratorias. Los hilos azules son el viento: f\xEDjate c\xF3mo se frena al cruzar cada rotor."},{parte:"aspas",nombre:"Aspas",modo:"viento",accion:"tormenta",eq:`Rotor de ${pe(tt.D)} m \xB7 ${pe(tt.area)} m\xB2 \xB7 ${pe(kf.rpm,1)} vueltas por minuto con 9 m/s`,recorrido:{noche:!1,adentro:!1},icono:'<circle cx="12" cy="12" r="1.800"/><path d="M12 10V3c2 1 2.500 3.500 0 7Z"/><path d="m13.700 13 6 3.500c-1.900 1.200-4.300.3-6-3.500Z"/><path d="m10.300 13-6 3.500c1.900 1.200 4.300.3 6-3.500Z"/>',texto:`Trabajan como el ala de un avi\xF3n: el aire crea una diferencia de presi\xF3n que las jala, y eso hace girar el rotor. No las empuja de frente. Este rotor mide ${pe(tt.D)} metros, y su c\xEDrculo cubre cerca de dos canchas de futbol. Se hacen de fibra de vidrio y se tuercen de la ra\xEDz a la punta.`},{parte:"paso",nombre:"Paso de las aspas",modo:"control",abrir:!0,accion:"tormenta",eq:`Con 15 m/s, giradas ${pe(uu.beta)}\xB0 para no pasar de ${pe(tt.mw,2)} MW`,recorrido:{noche:!1,adentro:!1},icono:'<circle cx="12" cy="12" r="3"/><path d="M12 9V3M9.400 13.500l-5 3M14.600 13.500l5 3"/><path d="M6 6.500c1-1 2-1.500 3-1.700"/>',texto:"Cada aspa gira sobre su propio eje, con un motor en el buje. Con poco viento va de frente, y toma todo lo que puede. Cuando sobra, se gira para soltar lo de m\xE1s y no pasar del tama\xF1o de la m\xE1quina. Con tormenta se pone de canto: el viento pasa sin empujarla."},{parte:"eje",nombre:"Eje y freno",modo:"viento",abrir:!0,accion:"desarme",eq:`Eje lento: ${pe(kf.rpm,1)} vueltas por minuto, con mucha fuerza`,recorrido:{noche:!1,adentro:!1},icono:'<path d="M3 12h18"/><rect x="8" y="9" width="3" height="6"/><circle cx="17" cy="12" r="3.500"/>',texto:"El rotor gira lento y con mucha fuerza. Este eje grueso, sobre su cojinete, lleva ese giro a la multiplicadora. De ah\xED sale un eje delgado y r\xE1pido, con un disco y una mordaza guinda: es el freno. Sujeta el rotor para darle mantenimiento; para detenerlo, primero se giran las aspas."},{parte:"multiplicadora",nombre:"Multiplicadora",modo:"viento",abrir:!0,accion:"desarme",eq:`Por ${tt.multiplica}: de ${pe(uu.rpm,1)} a ${pe(uu.rpm*tt.multiplica)} vueltas por minuto, de ejemplo`,recorrido:{noche:!1,adentro:!1},icono:'<circle cx="9" cy="10" r="5"/><circle cx="17" cy="16" r="3"/><path d="M9 7v6M6 10h6"/>',texto:"Es una caja de engranes. Toma el giro lento del rotor y lo vuelve muy r\xE1pido, porque un generador chico necesita girar r\xE1pido. Tiene tres etapas, una tras otra, y cada una acelera m\xE1s. Algunos aerogeneradores no la llevan: conectan el rotor directo a un generador mucho m\xE1s grande."},{parte:"generador",nombre:"Generador",modo:"viento",abrir:!0,accion:"desarme",eq:`${pe(tt.mw,2)} MW como m\xE1ximo; en una m\xE1quina parecida, a 690 V`,recorrido:{noche:!1,adentro:!1},icono:'<circle cx="12" cy="12" r="7.500"/><path d="M12.800 7.500 9.700 12.600h4.600l-3 4"/>',texto:`Aqu\xED nace la electricidad: el eje r\xE1pido hace girar un im\xE1n dentro de bobinas de cobre. Con ${tt.polos} polos, ${pe(1200)} vueltas por minuto dan los 60 ciclos por segundo de la red. El radiador del techo saca su calor. De cada 100 de lo que entra por el eje, salen cerca de ${pe(94)} ya como electricidad; el resto es calor.`},{parte:"convertidor",nombre:"Convertidor y transformador",modo:"viento",abrir:!0,accion:"desarme",eq:"De unos 690 V a 34.5 kV",recorrido:{noche:!1,adentro:!1},icono:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 12c1-3 2-3 3 0s2 3 3 0 2-3 3 0"/>',texto:"El viento cambia a cada rato, y con \xE9l, el giro. Esta electr\xF3nica, en la cola de la g\xF3ndola, deja la electricidad a los 60 ciclos de la red aunque el rotor vaya m\xE1s lento o m\xE1s r\xE1pido. El cable baja por la torre hasta el transformador del pie, que sube el voltaje para la red interna del parque."},{parte:"orientacion",nombre:"Orientaci\xF3n",modo:"control",abrir:!0,accion:"desviar",eq:`Desviada 30\xB0, da ${pe(sv*100)} % menos`,recorrido:{noche:!1,adentro:!1},icono:'<circle cx="12" cy="12" r="8"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4"/><path d="m12 12 3-3"/>',texto:"La veleta del techo dice de d\xF3nde viene el viento, y estos motores giran toda la g\xF3ndola sobre una corona, arriba de la torre, para mirarlo de frente. Importa: si el rotor no ve el viento de frente, le entra menos aire. Prueba a desviarla en el modo Control y mira c\xF3mo baja la potencia."},{parte:"torre",nombre:"Torre",modo:"viento",abrir:!0,accion:"noche",eq:`Este modelo: ${tt.bujes.map(i=>pe(i)).join(", ")} m`,recorrido:{noche:!1,adentro:!1},icono:'<path d="M10 21 11 4h2l1 17Z"/><path d="M8 21h8M10.500 11h3"/>',texto:"Es un tubo de acero, por tramos, que se adelgaza hacia arriba. Por dentro lleva una escalera y los cables que bajan del generador; abajo tiene una puerta. M\xE1s alto hay m\xE1s viento y menos remolinos del suelo, y por eso son tan altas. La luz roja de la g\xF3ndola avisa a los aviones."},{parte:"cimentacion",nombre:"Cimentaci\xF3n",modo:"viento",abrir:!0,accion:"desarme",eq:"Forma y tama\xF1o de ejemplo",recorrido:{noche:!1,adentro:!1},icono:'<path d="M4 18h16l-3-5H7Z"/><path d="M12 13V4M9 13V8M15 13V8"/>',texto:"Para verla, aqu\xED el aerogenerador sube: de verdad queda enterrada. Es una zapata de concreto con varillas de acero, y un anillo de pernos que amarra la torre. Su trabajo es que el viento no tumbe la m\xE1quina: el rotor empuja arriba, muy lejos del suelo. Forma y tama\xF1o son de ejemplo."},{parte:"estela",nombre:"Estela",modo:"estela",abrir:!0,accion:"estelaSep",eq:`A ${Ds} di\xE1metros, el aire va ${pe(Nr(Ds)*100)} % m\xE1s lento`,recorrido:{noche:!1,adentro:!1},icono:'<path d="M4 6v12"/><path d="M4 8c6 0 10 1 16 3"/><path d="M4 16c6 0 10-1 16-3"/>',texto:`Quien toma viento lo deja m\xE1s lento y revuelto, y al de atr\xE1s le llega menos. Por eso se separan: cerca de ${Ds} di\xE1metros es lo com\xFAn, unos ${pe(Ds*tt.D)} metros. M\xE1s lejos se pierde menos, pero cuesta m\xE1s en caminos, cables y terreno. Aqu\xED, para que quepan, est\xE1n mucho m\xE1s cerca.`},{parte:"subestacion",nombre:"Subestaci\xF3n",modo:"viento",abrir:!0,accion:"desarme",eq:`Parque de ${pe(Dr.mw)} MW: ${pe(iv)} amperes a 400 kV, de ejemplo`,recorrido:{noche:!1,adentro:!1},icono:'<path d="M4 20h16"/><path d="M7 20V8l5-4 5 4v12"/><path d="M7 12h10"/>',texto:"Los cables enterrados traen aqu\xED la electricidad de todos los aerogeneradores, a media tensi\xF3n, a menudo 34.5 kV. Este transformador la sube a alta tensi\xF3n para que viaje lejos con menos p\xE9rdidas. Los interruptores y las cuchillas a\xEDslan la central si hay una falla."},{parte:"red",nombre:"RNT y RGD",modo:"viento",accion:"noche",recorrido:{noche:!1,adentro:!1},icono:'<path d="M12 3 6 21M12 3l6 18M8 9h8M7 14h10"/>',texto:"La electricidad sale por la RNT, la Red Nacional de Transmisi\xF3n, que la lleva lejos y a grandes usuarios. Las RGD, Redes Generales de Distribuci\xF3n, la reparten al p\xFAblico. El CENACE decide cu\xE1ndo entra cada central. El viento no avisa: por eso importa pronosticarlo y tener otras centrales listas."}],av=Object.fromEntries(Ga.map(i=>[i.id,i.vista])),Gf=i=>`${pe(i,1)} m/s`,ov=i=>fl[Tt(Math.round(i),1,12)-1],cv={texto:"el a\xF1o",avanzar:(i,e)=>(i.mes=i.mes+e*12/28,i.mes>=12.49&&(i.mes=1),!1),alSeguir:()=>{}},lv={viento:{nombre:"Viento",corto:"Viento",resumen:"Mueve el viento y mira la curva de esta m\xE1quina: no arranca con poco, sube muy r\xE1pido, se queda en su tama\xF1o y se detiene con demasiado. O deja que pase una tormenta.",aclara:"De cada 100 de la energ\xEDa del viento que cruza el rotor, a d\xF3nde va.",mando:{nombre:"Viento a la altura del buje",campo:"v",rango:Ns.v,texto:Gf}},control:{nombre:"Paso y orientaci\xF3n",corto:"Control",resumen:"Aqu\xED mandas t\xFA. Gira las aspas y desv\xEDa la g\xF3ndola, y mira cu\xE1nta potencia se pierde. La m\xE1quina lo hace sola, var
