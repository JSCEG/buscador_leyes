<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inversor: de corriente directa a alterna · ¿Cómo funciona?</title>
<style>




/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

/* Estilo común de las máquinas de «¿Cómo funciona?» (sistema Búho + referencia del mosquito mecánico). Lo usan todas;
   scripts/build-conceptos-3d.mjs lo pone antes del style.css propio de cada máquina, que puede ajustarlo. */
@font-face { font-family: "Fraunces"; src: url("/fonts/Fraunces-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Manrope"; src: url("/fonts/Manrope-Variable.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }

:root { --papel: #fafafa; --papel-alto: #ffffff; --ceniza: #ebebe9; --linea: #d9dbdb; --tinta: #0a0707; --tinta-suave: #5b5e63; --rojo: #9b2247; --rojo-suave: #9b224714; --accion: #0a0707; --on-accion: #f4f4f2; --azul: #2e6fb0; }
:root[data-tema="oscuro"] { --papel: #080a19; --papel-alto: #13151f; --ceniza: #1c1f2a; --linea: #262a36; --tinta: #f1efea; --tinta-suave: #a4a7ae; --rojo: #e57a9a; --rojo-suave: #e57a9a24; --accion: #e9e9e9; --on-accion: #0a0707; --azul: #6ea8e0; }

/* El kit de la skill fija una consola de pantalla completa; aquí la figura fluye dentro de la página. */
html, body { height: auto; overflow: visible; background: var(--papel); }
body { margin: 0; color: var(--tinta); font: 450 14px/1.45 Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#app { position: static; inset: auto; color: var(--tinta); font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 2px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }

.g-escena { position: relative; aspect-ratio: 16 / 10; border: 1px solid var(--linea); border-radius: 16px; overflow: hidden; background: var(--papel); touch-action: none; }
.g-lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.g-escena.arrastra .g-lienzo { cursor: grabbing; }
.g-guia { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.g-guia line { stroke: var(--rojo); stroke-width: 1.5; }
.g-guia circle { fill: var(--rojo); stroke: var(--papel-alto); stroke-width: 2; }
.g-etiqueta { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; max-width: 260px; padding: 6px 12px 6px 6px; border: 1px solid var(--rojo); border-radius: 999px; background: var(--papel-alto); box-shadow: 0 8px 20px -12px #0a070766; pointer-events: none; will-change: transform; }
.g-etiqueta[hidden] { display: none; }
.g-etiqueta b { display: grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--rojo); color: var(--papel-alto); font: 700 12px/1 Manrope, sans-serif; }
.g-etiqueta span { font: 500 15px/1.2 Fraunces, Georgia, serif; color: var(--tinta); }
.g-escena-acciones { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; pointer-events: none; }
.g-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 12px; border: 1px solid var(--linea); border-radius: 999px; background: color-mix(in srgb, var(--papel-alto) 88%, transparent); font-size: 12.5px; font-weight: 600; cursor: pointer; pointer-events: auto; backdrop-filter: blur(8px); }
.g-chip[aria-pressed="true"] { border-color: var(--rojo); color: var(--rojo); background: color-mix(in srgb, var(--papel-alto) 80%, var(--rojo-suave)); }
.g-chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.g-chip[aria-pressed="true"] i { animation: g-late 1.2s steps(2) infinite; }
@keyframes g-late { 50% { opacity: .2; } }

.g-tablero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; }
.g-tablero > section, .g-partes { padding: 12px 14px; border: 1px solid var(--linea); border-radius: 14px; background: var(--papel-alto); }
.g-cifras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.g-cifras div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.g-cifras span { font-size: 12px; font-weight: 600; color: var(--tinta-suave); }
.g-cifras b { font: 500 26px/1.1 Fraunces, Georgia, serif; font-variant-numeric: tabular-nums; color: var(--tinta); }
.g-cifras small { font-size: 11.5px; color: var(--tinta-suave); }
.g-control { display: flex; flex-direction: column; gap: 10px; }
.g-deslizador { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
.g-deslizador input { width: 100%; accent-color: var(--rojo); }
.g-seg { display: inline-flex; align-self: flex-start; gap: 2px; padding: 3px; border: 1px solid var(--linea); border-radius: 12px; background: var(--papel); }
.g-seg button { min-height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: var(--tinta-suave); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.g-seg button[aria-checked="true"] { background: var(--accion); color: var(--on-accion); }
.g-curva { grid-column: 1 / -1; }
.g-curva-cab { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px; }
.g-curva-cab b { font: 500 16px/1.2 Fraunces, Georgia, serif; }
.g-curva-cab span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--tinta-suave); }
.g-curva-cab i { display: inline-block; width: 14px; height: 3px; margin-left: 6px; border-radius: 2px; }
.g-curva-cab .f1 { background: var(--rojo); }
.g-curva-cab .f2 { background: var(--azul); }
.g-curva-cab .f3 { background: var(--tinta-suave); }
.g-curva canvas { display: block; width: 100%; height: 110px; margin: 6px 0; }
.g-curva p { margin: 0; font-size: 12.5px; color: var(--tinta-suave); }
.g-partes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.g-partes button { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 5px; border: 1px solid var(--linea); border-radius: 999px; background: var(--papel); font-size: 13px; font-weight: 600; cursor: pointer; }
.g-partes button span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ceniza); font-size: 12px; font-weight: 700; }
.g-partes button[aria-pressed="true"] { border-color: var(--rojo); color: var(--rojo); background: var(--rojo-suave); }
.g-partes button[aria-pressed="true"] span { background: var(--rojo); color: var(--papel-alto); }

@media (max-width: 620px) {
  .g-escena { aspect-ratio: 4 / 3; }
  .g-tablero { grid-template-columns: minmax(0, 1fr); }
  .g-cifras b { font-size: 22px; }
}
@media (max-width: 480px) { .g-escena { aspect-ratio: 4 / 5; } }
@media (prefers-reduced-motion: reduce) { .g-chip[aria-pressed="true"] i { animation: none; } }

/* Logo del Buscador en la esquina de la escena */
.g-marca { position: absolute; right: 12px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; background: color-mix(in srgb, var(--papel-alto) 78%, transparent); color: var(--tinta); pointer-events: none; backdrop-filter: blur(6px); }
.g-marca svg { width: 18px; height: 21px; flex: none; }
.g-marca span { font: 500 13px/1 Fraunces, Georgia, serif; letter-spacing: -0.01em; }

/* Botón de pantalla completa */
.g-grupo { display: inline-flex; gap: 6px; }
.g-chip-icono { width: 34px; padding: 0; justify-content: center; }
.g-chip-icono svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Pantalla completa: la escena llena la pantalla y abajo flotan las partes y el control de velocidad */
.g-flot { display: none; }
.g-escena.completa { aspect-ratio: auto; width: 100%; height: 100%; border: 0; border-radius: 0; }
.g-escena.simulada { position: fixed; inset: 0; z-index: 10; width: 100vw; height: 100vh; height: 100dvh; }
html.g-bloqueo, html.g-bloqueo body { overflow: hidden; }
.g-escena.completa .g-escena-acciones { top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); }
.g-escena.completa .g-marca { top: calc(max(12px, env(safe-area-inset-top)) + 44px); right: max(12px, env(safe-area-inset-right)); bottom: auto; }
.g-escena.completa .g-flot { position: absolute; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.g-flot > * { pointer-events: auto; max-width: 100%; border: 1px solid var(--linea); background: color-mix(in srgb, var(--papel-alto) 90%, transparent); backdrop-filter: blur(10px); box-shadow: 0 10px 28px -18px #0a070780; }
.g-flot-partes { display: flex; gap: 6px; padding: 6px; border-radius: 999px; overflow-x: auto; scrollbar-width: none; }
.g-flot-partes::-webkit-scrollbar { display: none; }
.g-flot-partes button { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 5px; border: 1px solid transparent; border-radius: 999px; background: none; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.g-flot-partes button span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ceniza); font-size: 12px; font-weight: 700; }
.g-flot-partes button[aria-pressed="true"] { border-color: var(--rojo); color: var(--rojo); background: var(--rojo-suave); }
.g-flot-partes button[aria-pressed="true"] span { background: var(--rojo); color: var(--papel-alto); }
.g-flot-ctrl { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; padding: 8px 14px; border-radius: 16px; }
@media (max-width: 620px) {
  .g-escena.completa .g-marca span { display: none; }
}

/* Cifra principal en la escena */
.g-hud { position: absolute; left: 14px; bottom: 12px; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 14px; background: color-mix(in srgb, var(--papel-alto) 80%, transparent); backdrop-filter: blur(6px); pointer-events: none; }
.g-hud > b { font: 500 34px/1 Fraunces, Georgia, serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--tinta); }
.g-hud > span { font-size: 12.5px; font-weight: 600; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.g-escena.completa .g-hud { top: calc(max(12px, env(safe-area-inset-top)) + 46px); left: max(12px, env(safe-area-inset-left)); bottom: auto; }

/* Números de las piezas cuando la máquina está desarmada */
.g-nums { position: absolute; inset: 0; pointer-events: none; transition: opacity .2s; }
.g-nums[hidden] { display: none; }
.g-nums span { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 3px; border: 1px solid var(--linea); border-radius: 999px; background: var(--papel-alto); white-space: nowrap; will-change: transform; }
.g-nums b { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--ceniza); font: 700 11px/1 Manrope, sans-serif; }
.g-nums i { font: 500 13px/1 Fraunces, Georgia, serif; font-style: normal; }
.g-nums span.activo { border-color: var(--rojo); color: var(--rojo); }
.g-nums span.activo b { background: var(--rojo); color: var(--papel-alto); }

/* Controles: dos deslizadores y dos selectores, iguales en el tablero y en pantalla completa */
.g-control { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; align-content: start; }
.g-filas { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.g-flot-ctrl { display: grid; grid-template-columns: repeat(2, minmax(160px, 240px)); gap: 8px 16px; padding: 10px 14px; border-radius: 16px; }
.g-flot-ctrl .g-filas { justify-content: center; }
@media (max-width: 620px) {
  .g-hud > b { font-size: 26px; }
  .g-nums i { display: none; }
  .g-control { grid-template-columns: minmax(0, 1fr); }
  .g-flot-ctrl { grid-template-columns: minmax(0, 1fr); width: 100%; }
}
@media (max-width: 620px) {
  .g-flot-ctrl .g-filas { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
  .g-flot-ctrl .g-seg { flex: none; }

/* Fondo de estudio como la referencia: papel con trazos finos de construcción detrás de la máquina */
